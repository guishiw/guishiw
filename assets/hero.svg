<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Guishi W — AI Engineering</title>
  <desc id="desc">A dark blue gradient banner introducing Guishi W and the focus areas LLM engineering, RAG, agents, and computer vision.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B17"/>
      <stop offset="0.52" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#111B35"/>
    </linearGradient>
    <radialGradient id="blueGlow" cx="0" cy="0" r="1" gradientTransform="translate(985 38) rotate(137) scale(410 300)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0EA5E9" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetGlow" cx="0" cy="0" r="1" gradientTransform="translate(1160 270) rotate(-151) scale(360 240)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#94A3B8" stroke-opacity="0.16" stroke-width="1"/>
    </pattern>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="28" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="28" fill="url(#blueGlow)"/>
  <rect width="1200" height="320" rx="28" fill="url(#violetGlow)"/>

  <g opacity="0.72" fill="none" stroke-linecap="round">
    <path d="M880 77 L974 45 L1069 91 L1116 180 L1032 250 L918 231 L852 156 Z" stroke="url(#accent)" stroke-width="2"/>
    <path d="M910 128 L974 45 M910 128 L852 156 M910 128 L918 231 M910 128 L1032 250 M910 128 L1069 91 M1069 91 L1116 180 M1116 180 L1032 250" stroke="#64748B" stroke-opacity="0.55" stroke-width="1.5"/>
    <circle cx="974" cy="45" r="7" fill="#38BDF8" stroke="#BAE6FD" stroke-width="2"/>
    <circle cx="1069" cy="91" r="5" fill="#818CF8" stroke="#C7D2FE" stroke-width="2"/>
    <circle cx="1116" cy="180" r="7" fill="#A78BFA" stroke="#DDD6FE" stroke-width="2"/>
    <circle cx="1032" cy="250" r="5" fill="#A78BFA" stroke="#DDD6FE" stroke-width="2"/>
    <circle cx="918" cy="231" r="7" fill="#0EA5E9" stroke="#BAE6FD" stroke-width="2"/>
    <circle cx="852" cy="156" r="5" fill="#38BDF8" stroke="#BAE6FD" stroke-width="2"/>
    <circle cx="910" cy="128" r="11" fill="#0F172A" stroke="url(#accent)" stroke-width="3"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace">
    <text x="64" y="82" fill="#38BDF8" font-size="20" font-weight="700" letter-spacing="5">HELLO, I'M</text>
    <text x="62" y="157" fill="#F8FAFC" font-size="62" font-weight="800" letter-spacing="1">GUISHI W</text>
    <rect x="64" y="178" width="560" height="4" rx="2" fill="url(#accent)"/>
    <text x="64" y="218" fill="#CBD5E1" font-size="21">AI Engineering · LLM Applications · Intelligent Systems</text>
  </g>

  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="600">
    <rect x="64" y="250" width="138" height="38" rx="19" fill="#0EA5E9" fill-opacity="0.14" stroke="#38BDF8" stroke-opacity="0.55"/>
    <text x="133" y="275" text-anchor="middle" fill="#BAE6FD">LLM Engineering</text>
    <rect x="216" y="250" width="74" height="38" rx="19" fill="#8B5CF6" fill-opacity="0.14" stroke="#A78BFA" stroke-opacity="0.55"/>
    <text x="253" y="275" text-anchor="middle" fill="#DDD6FE">RAG</text>
    <rect x="304" y="250" width="90" height="38" rx="19" fill="#8B5CF6" fill-opacity="0.14" stroke="#A78BFA" stroke-opacity="0.55"/>
    <text x="349" y="275" text-anchor="middle" fill="#DDD6FE">Agents</text>
    <rect x="408" y="250" width="150" height="38" rx="19" fill="#0EA5E9" fill-opacity="0.14" stroke="#38BDF8" stroke-opacity="0.55"/>
    <text x="483" y="275" text-anchor="middle" fill="#BAE6FD">Computer Vision</text>
  </g>
</svg>
